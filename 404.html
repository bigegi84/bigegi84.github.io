<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirecting…</title>
    <meta http-equiv="refresh" content="0; URL='/?'" />
    <script>
      // Preserve path, query, and hash
      const redirectTo =
        "/?" + location.pathname.slice(1) + location.search + location.hash;
      window.location.replace(redirectTo);
    </script>
    <style>
      body {
        font-family: sans-serif;
        text-align: center;
        padding: 2em;
      }
    </style>
  </head>
  <body>
    <h1>Redirecting…</h1>
    <p>
      If you're not redirected automatically,
      <a id="redirect-link" href="/">click here</a>.
    </p>
    <script>
      document.getElementById("redirect-link").href = redirectTo;
    </script>
  </body>
</html>
